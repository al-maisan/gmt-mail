name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packaging scripts read the version and changelogs from the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The release toolchain (RELEASE_GO in the Makefile), checked below.
          go-version: "1.26.10"
      - run: test "$(go env GOVERSION)" = "$(make -s print-release-go)" || { echo "CI Go $(go env GOVERSION) is not RELEASE_GO $(make -s print-release-go); update ci.yml"; exit 1; }
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
      - run: make vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: make test
      # Tests of the packaging and release scripts; no network, no signing.
      - run: make test-pkg
      - run: make build && ./gmt-mail -version
